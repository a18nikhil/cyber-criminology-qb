
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071527">

<title>Cyber Criminology</title>

<style>

/* ==========================================
   GLOBAL
========================================== */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, Cambria, "Times New Roman", serif;
    color: #F3F8FF;

    background-color: #071527;

    background-image:
        radial-gradient(
            ellipse at 15% 10%,
            rgba(25, 132, 195, 0.25),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 90% 85%,
            rgba(28, 105, 180, 0.25),
            transparent 45%
        ),
        linear-gradient(
            rgba(120, 190, 240, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(120, 190, 240, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            145deg,
            #071527 0%,
            #102B49 52%,
            #08182D 100%
        );

    background-size:
        auto,
        auto,
        42px 42px,
        42px 42px,
        auto;
}

/* ==========================================
   MAIN CONTAINER
========================================== */

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 65px 24px 65px;
}

/* ==========================================
   TITLE SECTION
========================================== */

.hero {
    position: relative;
    text-align: center;
    padding: 35px 20px 55px;
}

.hero::before {
    content: "";
    position: absolute;

    width: 320px;
    height: 320px;

    top: -80px;
    left: 50%;
    transform: translateX(-50%);

    background: radial-gradient(
        circle,
        rgba(64, 160, 220, 0.16),
        transparent 70%
    );

    pointer-events: none;
}

/* MAIN TITLE */

.hero-title {
    position: relative;
    z-index: 1;

    margin: 0;

    font-size: clamp(42px, 6vw, 72px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -1px;

    color: #F5E6C8;

    text-shadow:
        0 4px 22px rgba(0, 0, 0, 0.28);
}

.hero-title span {
    display: block;
    color: #E8C98B;
}

/* DECORATIVE LINE */

.hero-divider {
    width: 110px;
    height: 2px;
    margin: 25px auto 0;

    background: linear-gradient(
        90deg,
        transparent,
        #D9B46C,
        transparent
    );
}

/* ==========================================
   UNIT CARDS
========================================== */

.units {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.unit-card {
    position: relative;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 145px;
    padding: 32px 25px;

    text-align: center;
    text-decoration: none;
    color: #F3F8FF;

    background: linear-gradient(
        115deg,
        rgba(22, 53, 84, 0.94),
        rgba(12, 35, 62, 0.96)
    );

    border: 1px solid rgba(130, 193, 235, 0.20);
    border-radius: 17px;

    box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.12);

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

/* LEFT ACCENT */

.unit-card::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 4px;

    background: linear-gradient(
        180deg,
        #DCC18B,
        #9D793B
    );
}

/* SUBTLE CARD GLOW */

.unit-card::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -80px;
    bottom: -110px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(212, 175, 110, 0.10),
        transparent 70%
    );

    pointer-events: none;
}

.unit-card:hover {
    transform: translateY(-3px);

    border-color: rgba(226, 193, 130, 0.55);

    box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.20);
}

.unit-card:focus-visible {
    outline: 3px solid #E8C98B;
    outline-offset: 4px;
}

/* ==========================================
   UNIT CONTENT
========================================== */

.unit-content {
    position: relative;
    z-index: 1;

    width: 100%;
    text-align: center;
}

/* QUESTION COUNT - TOP RIGHT */

.question-count {
    position: absolute;
    top: 14px;
    right: 19px;

    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 400;

    color: #A6B6C6;
}

/* UNIT NUMBER */

.unit-number {
    display: block;
    margin-bottom: 13px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;

    color: #D8BE8C;
}

/* UNIT TITLE */

.unit-title {
    display: block;

    font-size: 27px;
    font-weight: 700;
    line-height: 1.3;

    color: #F7FAFF;
}

/* ==========================================
   DESKTOP
========================================== */

@media (min-width: 900px) {

    .container {
        padding-top: 75px;
    }

    .hero {
        padding-bottom: 65px;
    }

    .unit-card {
        min-height: 155px;
    }
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

    .container {
        padding: 25px 16px 32px;
    }

    .hero {
        padding: 30px 5px 42px;
    }

    .hero-title {
        font-size: clamp(38px, 10vw, 49px);
        line-height: 1.12;
        letter-spacing: -0.5px;
    }

    .hero-divider {
        margin-top: 20px;
        width: 85px;
    }

    .units {
        gap: 13px;
    }

    .unit-card {
        min-height: 118px;
        padding: 31px 17px 23px;
        border-radius: 14px;
    }

    .question-count {
        top: 10px;
        right: 13px;
        font-size: 11px;
    }

    .unit-number {
        font-size: 11px;
        margin-bottom: 10px;
        letter-spacing: 2px;
    }

    .unit-title {
        font-size: 20px;
        line-height: 1.3;
    }
}

/* ==========================================
   SMALL PHONES
========================================== */

@media (max-width: 380px) {

    .container {
        padding-left: 12px;
        padding-right: 12px;
    }

    .hero-title {
        font-size: 36px;
    }

    .unit-card {
        min-height: 110px;
        padding: 28px 13px 20px;
    }

    .unit-title {
        font-size: 18px;
    }
}

/* ==========================================
   SHORT MOBILE SCREENS
========================================== */

@media (max-width: 600px) and (max-height: 700px) {

    .container {
        padding-top: 15px;
    }

    .hero {
        padding-top: 15px;
        padding-bottom: 28px;
    }

    .hero-divider {
        margin-top: 15px;
    }

    .units {
        gap: 10px;
    }

    .unit-card {
        min-height: 100px;
        padding-top: 24px;
        padding-bottom: 18px;
    }

    .unit-title {
        font-size: 18px;
    }
}

/* ==========================================
   REDUCED MOTION
========================================== */

@media (prefers-reduced-motion: reduce) {

    .unit-card {
        transition: none;
    }
}

</style>

</head>

<body>

<main class="container">

    <!-- MAIN TITLE -->

    <header class="hero">

        <h1 class="hero-title">
            Cyber
            <span>Criminology</span>
        </h1>

        <div class="hero-divider"></div>

    </header>

    <!-- THREE UNIT CARDS -->

    <nav class="units" aria-label="Select a unit">

        <!-- UNIT I -->

        <a href="unit1/index.html" class="unit-card">

            <span class="question-count">
                10 Questions
            </span>

            <div class="unit-content">

                <span class="unit-number">
                    UNIT I
                </span>

                <span class="unit-title">
                    Introduction to Cyber Criminology
                </span>

            </div>

        </a>

        <!-- UNIT II -->

        <a href="unit2/index.html" class="unit-card">

            <span class="question-count">
                12 Questions
            </span>

            <div class="unit-content">

                <span class="unit-number">
                    UNIT II
                </span>

                <span class="unit-title">
                    Digital Piracy and Cyber Victimization
                </span>

            </div>

        </a>

        <!-- UNIT III -->

        <a href="unit3/index.html" class="unit-card">

            <span class="question-count">
                8 Questions
            </span>

            <div class="unit-content">

                <span class="unit-number">
                    UNIT III
                </span>

                <span class="unit-title">
                    Cyber Crime, Victimization and Human Rights
                </span>

            </div>

        </a>

    </nav>

</main>

</body>

</html>
