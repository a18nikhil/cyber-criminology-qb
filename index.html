
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Criminology | Exam Oriented Questions & Answers</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, Cambria, "Times New Roman", serif;
    color: #102A43;

    background-color: #EAF3F9;
    background-image: url("background.png");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 42px 18px 55px;
}

/* COVER IMAGE */

.banner {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 38px;
}

.banner img {
    display: block;
    width: 100%;
    max-width: 500px;
    height: auto;
    border-radius: 12px;
}

/* UNIT CARDS */

.units {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.unit-card {
    position: relative;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    min-height: 145px;
    padding: 30px 20px;

    background: rgba(250, 250, 247, 0.96);
    border: 1px solid #DFE4E8;
    border-radius: 17px;

    text-decoration: none;
    text-align: center;
    color: #102A43;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.unit-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(16, 42, 67, 0.09);
}

.unit-card:focus-visible {
    outline: 3px solid #386D9A;
    outline-offset: 4px;
}

/* QUESTION COUNT */

.question-count {
    position: absolute;
    top: 18px;
    right: 20px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #8A929B;
}

/* UNIT LABEL */

.unit-number {
    display: block;
    margin-bottom: 12px;

    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #64748B;
}

/* UNIT TITLE */

.unit-title {
    display: block;

    font-size: 27px;
    font-weight: 700;
    line-height: 1.35;
    color: #102A43;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 30px 15px 45px;
    }

    .banner {
        margin-bottom: 30px;
    }

    .banner img {
        max-width: 100%;
        border-radius: 10px;
    }

    .units {
        gap: 18px;
    }

    .unit-card {
        min-height: 140px;
        padding: 43px 16px 25px;
        border-radius: 16px;
    }

    .question-count {
        top: 13px;
        right: 15px;
        font-size: 12px;
    }

    .unit-number {
        font-size: 14px;
        margin-bottom: 10px;
    }

    .unit-title {
        font-size: 23px;
        line-height: 1.35;
    }
}

/* SMALL PHONES */

@media (max-width: 380px) {

    .unit-title {
        font-size: 21px;
    }

    .unit-card {
        padding-left: 12px;
        padding-right: 12px;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    .unit-card {
        transition: none;
    }
}

</style>

</head>

<body>

<main class="container">

    <!-- COVER IMAGE -->

    <header class="banner">

        <img
            src="criminology.png"
            alt="Cyber Criminology - Exam Oriented Questions and Answers"
        >

    </header>

    <!-- UNIT CARDS -->

    <nav class="units" aria-label="Select a unit">

        <!-- UNIT I -->

        <a href="unit1/index.html" class="unit-card">

            <span class="question-count">
                10 Questions
            </span>

            <span class="unit-number">
                UNIT I
            </span>

            <span class="unit-title">
                Introduction to Cyber Criminology
            </span>

        </a>

        <!-- UNIT II -->

        <a href="unit2/index.html" class="unit-card">

            <span class="question-count">
                12 Questions
            </span>

            <span class="unit-number">
                UNIT II
            </span>

            <span class="unit-title">
                Digital Piracy and Cyber Victimization
            </span>

        </a>

        <!-- UNIT III -->

        <a href="unit3/index.html" class="unit-card">

            <span class="question-count">
                8 Questions
            </span>

            <span class="unit-number">
                UNIT III
            </span>

            <span class="unit-title">
                Cyber Crime, Victimization and Human Rights
            </span>

        </a>

    </nav>

</main>

</body>
</html>
