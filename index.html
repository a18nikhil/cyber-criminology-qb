
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Criminology | Exam Oriented Questions & Answers</title>

<style>

/* GLOBAL */

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, Cambria, "Times New Roman", serif;
    color: #102A43;

    background-color: #EAF3F9;
    background-image: url("background.png");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 25px 18px 35px;
}

/* COVER IMAGE */

.banner {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 22px;
}

.banner img {
    display: block;
    width: 100%;
    max-width: 370px;
    height: auto;
    border-radius: 10px;
}

/* UNIT CARDS */

.units {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.unit-card {
    position: relative;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    min-height: 110px;
    padding: 24px 20px;

    background: rgba(250, 250, 247, 0.96);
    border: 1px solid #DFE4E8;
    border-radius: 15px;

    text-decoration: none;
    text-align: center;
    color: #102A43;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.unit-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(16, 42, 67, 0.08);
}

.unit-card:focus-visible {
    outline: 3px solid #386D9A;
    outline-offset: 3px;
}

/* QUESTION COUNT */

.question-count {
    position: absolute;
    top: 12px;
    right: 15px;

    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #8A929B;
}

/* UNIT NUMBER */

.unit-number {
    display: block;
    margin-bottom: 7px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.7px;
    color: #64748B;
}

/* UNIT TITLE */

.unit-title {
    display: block;
    font-size: 23px;
    font-weight: 700;
    line-height: 1.25;
    color: #102A43;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 14px 14px 22px;
    }

    .banner {
        margin-bottom: 17px;
    }

    .banner img {
        width: 100%;
        max-width: 280px;
        border-radius: 9px;
    }

    .units {
        gap: 12px;
    }

    .unit-card {
        min-height: 98px;
        padding: 25px 14px 15px;
        border-radius: 14px;
    }

    .question-count {
        top: 9px;
        right: 12px;
        font-size: 11px;
    }

    .unit-number {
        font-size: 12px;
        margin-bottom: 7px;
        letter-spacing: 1.5px;
    }

    .unit-title {
        font-size: 19px;
        line-height: 1.23;
    }

    body {
        background-attachment: scroll;
    }

}

/* SMALL PHONES */

@media (max-width: 380px) {

    .banner img {
        max-width: 245px;
    }

    .unit-card {
        min-height: 92px;
        padding: 24px 12px 14px;
    }

    .unit-title {
        font-size: 17px;
    }

    .units {
        gap: 10px;
    }

}

/* SHORT MOBILE SCREENS */

@media (max-width: 600px) and (max-height: 740px) {

    .container {
        padding-top: 10px;
        padding-bottom: 15px;
    }

    .banner {
        margin-bottom: 12px;
    }

    .banner img {
        max-width: 225px;
    }

    .units {
        gap: 9px;
    }

    .unit-card {
        min-height: 86px;
        padding: 22px 12px 12px;
    }

    .unit-title {
        font-size: 17px;
    }

    .unit-number {
        font-size: 11px;
        margin-bottom: 5px;
    }

}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

    .unit-card {
        transition: none;
    }

}

</style>

</head>

<body>

<main class="container">

    <!-- COVER IMAGE -->

    <header class="banner">

        <img
            src="criminology.png"
            alt="Cyber Criminology - Exam Oriented Questions and Answers"
        >

    </header>

    <!-- UNIT CARDS -->

    <nav class="units" aria-label="Select a unit">

        <!-- UNIT I -->

        <a href="unit1/index.html" class="unit-card">

            <span class="question-count">
                10 Questions
            </span>

            <span class="unit-number">
                UNIT I
            </span>

            <span class="unit-title">
                Introduction to Cyber Criminology
            </span>

        </a>

        <!-- UNIT II -->

        <a href="unit2/index.html" class="unit-card">

            <span class="question-count">
                12 Questions
            </span>

            <span class="unit-number">
                UNIT II
            </span>

            <span class="unit-title">
                Digital Piracy and Cyber Victimization
            </span>

        </a>

        <!-- UNIT III -->

        <a href="unit3/index.html" class="unit-card">

            <span class="question-count">
                8 Questions
            </span>

            <span class="unit-number">
                UNIT III
            </span>

            <span class="unit-title">
                Cyber Crime, Victimization and Human Rights
            </span>

        </a>

    </nav>

</main>

</body>

</html>
