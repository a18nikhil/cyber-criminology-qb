
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Criminology | Questions & Answers</title>

<style>
* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    background: #F3F3F0;
    color: #242424;
    font-family: Georgia, Cambria, "Times New Roman", serif;
    line-height: 1.5;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 25px 18px 45px;
}

/* Header */

.header {
    text-align: center;
    background: #FFFFFF;
    border-radius: 9px;
    margin-bottom: 26px;
    border-top: 5px solid #263B5E;
    overflow: hidden;
}

.header-content {
    padding: 30px 20px 23px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 1px;
    color: #1D2F4D;
}

.subtitle {
    margin: 9px 0 0;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #526A7D;
}

/* Banner image */

.hero-image {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 7;
    object-fit: cover;
    object-position: center;
}

/* Section heading */

.section-title {
    font-size: 22px;
    font-weight: 400;
    color: #1D2F4D;
    margin: 0 0 17px;
    border-bottom: 1px solid #C9C9C5;
    padding-bottom: 8px;
}

/* Unit cards */

.unit-card {
    display: block;
    background: #FFFFFF;
    margin-bottom: 16px;
    padding: 22px;
    border-radius: 9px;
    text-decoration: none;
    color: inherit;
    border-left: 5px solid #263B5E;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
}

.unit-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

.unit-card:focus-visible {
    outline: 2px solid #245487;
    outline-offset: 3px;
}

.unit-number {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666666;
}

.unit-card h2 {
    margin: 5px 0 11px;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.4;
    color: #1D2F4D;
}

.open-unit {
    font-size: 16px;
    color: #245487;
}

/* Mobile */

@media (max-width: 600px) {

    .container {
        padding: 14px 10px 30px;
    }

    .header {
        margin-bottom: 24px;
    }

    .header-content {
        padding: 24px 12px 20px;
    }

    .header h1 {
        font-size: 25px;
        letter-spacing: 0.5px;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: 1.2px;
        line-height: 1.6;
    }

    .hero-image {
        aspect-ratio: 16 / 8.5;
    }

    .section-title {
        font-size: 20px;
        margin-bottom: 14px;
    }

    .unit-card {
        padding: 17px 15px;
        margin-bottom: 13px;
    }

    .unit-number {
        font-size: 12px;
    }

    .unit-card h2 {
        font-size: 18px;
        margin: 5px 0 8px;
        line-height: 1.4;
    }

    .open-unit {
        font-size: 14px;
    }
}

@media (max-width: 380px) {
    .header h1 {
        font-size: 23px;
    }

    .subtitle {
        font-size: 9px;
        letter-spacing: 1px;
    }

    .unit-card h2 {
        font-size: 17px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .unit-card {
        transition: none;
    }
}
</style>
</head>

<body>

<div class="container">

    </div>

    <img
        src="criminology.png"
        alt="Cyber criminology illustration featuring a digital globe, cybersecurity, online crime and justice"
        class="hero-image"
        width="1920"
        height="768"
        fetchpriority="high"
    >

</header>

<main>

<h2 class="section-title">Select a Unit</h2>

<a href="unit1/index.html" class="unit-card">

    <div class="unit-number">UNIT I</div>

    <h2>Introduction to Cyber Criminology</h2>

    <div class="open-unit">
        View Unit I →
    </div>

</a>

<a href="unit2/index.html" class="unit-card">

    <h2>Digital Piracy and Cyber Victimization</h2>

</a>

<a href="unit3/index.html" class="unit-card">

    <h2>Cyber Crime, Victimization and Human Rights</h2>

</main>

</div>

</body>
</html>
