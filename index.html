<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Criminology</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f4f4;
            color: #222;
            font-family: "Times New Roman", Times, serif;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 18px 45px;
        }

        .header {
            text-align: center;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 8px;
            margin-bottom: 26px;
            border-top: 5px solid #263b5e;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 1px;
            color: #1d2f4d;
        }

        .section-title {
            font-size: 20px;
            font-weight: normal;
            color: #1d2f4d;
            margin: 0 0 14px;
            border-bottom: 1px solid #bbb;
            padding-bottom: 6px;
        }

        .unit-card {
            display: block;
            background: #ffffff;
            margin-bottom: 16px;
            padding: 20px;
            border-radius: 7px;
            text-decoration: none;
            color: inherit;
            border-left: 4px solid #263b5e;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .unit-number {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .unit-card h2 {
            margin: 3px 0 10px;
            font-size: 22px;
            font-weight: normal;
            color: #1d2f4d;
        }

        .open-unit {
            font-size: 16px;
            color: #1d4f91;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                padding: 14px 10px 30px;
            }

            .header {
                padding: 20px 10px;
                margin-bottom: 20px;
            }

            .header h1 {
                font-size: 25px;
                letter-spacing: 0.5px;
            }

            .section-title {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .unit-card {
                padding: 15px 14px;
                margin-bottom: 12px;
            }

            .unit-number {
                font-size: 12px;
            }

            .unit-card h2 {
                font-size: 17px;
                margin: 3px 0 7px;
                white-space: nowrap;
                letter-spacing: -0.2px;
            }

            .open-unit {
                font-size: 14px;
            }
        }

        /* Extra-small phones */
        @media (max-width: 380px) {

            .unit-card h2 {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>CYBER CRIMINOLOGY</h1>
    </header>


    <h2 class="section-title">Select a Unit</h2>


    <a href="unit1/index.html" class="unit-card">

        <div class="unit-number">UNIT I</div>

        <h2>Introduction to Cyber Criminology</h2>

        <div class="open-unit">
            View Unit I →
        </div>

    </a>


    <a href="unit2/index.html" class="unit-card">

        <div class="unit-number">UNIT II</div>

        <h2>Digital Piracy and Cyber Victimization</h2>

        <div class="open-unit">
            View Unit II →
        </div>

    </a>


    <a href="unit3/index.html" class="unit-card">

        <div class="unit-number">UNIT III</div>

        <h2>Cyber Crime, Victimization and Human Rights</h2>

        <div class="open-unit">
            View Unit III →
        </div>

    </a>

</div>

</body>
</html>
