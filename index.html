
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071527">

<title>Cyber Criminology | Exam Oriented Questions & Answers</title>

<style>

/* ==========================================
   GLOBAL
========================================== */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, Cambria, "Times New Roman", serif;
    color: #F3F8FF;

    background-color: #071527;

    background-image:
        radial-gradient(
            ellipse at 15% 10%,
            rgba(25, 132, 195, 0.25),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 90% 85%,
            rgba(28, 105, 180, 0.25),
            transparent 45%
        ),
        linear-gradient(
            rgba(120, 190, 240, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(120, 190, 240, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            145deg,
            #071527 0%,
            #102B49 52%,
            #08182D 100%
        );

    background-size:
        auto,
        auto,
        42px 42px,
        42px 42px,
        auto;
}

/* ==========================================
   PAGE CONTAINER
========================================== */

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;

    padding: 65px 24px 65px;
}

/* ==========================================
   HEADER
========================================== */

.hero {
    position: relative;
    text-align: center;
    padding: 35px 20px 48px;
}

.hero::before {
    content: "";
    position: absolute;

    width: 290px;
    height: 290px;

    top: -65px;
    left: 50%;
    transform: translateX(-50%);

    background: radial-gradient(
        circle,
        rgba(51, 167, 231, 0.17),
        transparent 70%
    );

    pointer-events: none;
}

.hero-label {
    display: inline-block;

    margin-bottom: 22px;
    padding: 8px 17px;

    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;

    color: #8DDCFF;

    border: 1px solid rgba(100, 200, 255, 0.28);
    border-radius: 50px;

    background: rgba(42, 125, 180, 0.10);
}

.hero-title {
    position: relative;
    z-index: 1;

    margin: 0;

    font-size: clamp(40px, 6vw, 69px);
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -1.5px;

    color: #FFFFFF;

    text-shadow:
        0 4px 25px rgba(0, 0, 0, 0.22);
}

.hero-title span {
    display: block;

    color: #8EDBFF;
}

/* DECORATIVE LINE */

.hero-divider {
    width: 105px;
    height: 2px;

    margin: 25px auto 23px;

    background: linear-gradient(
        90deg,
        transparent,
        #68CFFF,
        transparent
    );
}

/* SUBTITLE */

.hero-subtitle {
    margin: 0;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2.5px;
    line-height: 1.7;

    text-transform: uppercase;
    color: #B8D0E4;
}

/* ==========================================
   UNIT CARDS
========================================== */

.units {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.unit-card {
    position: relative;
    overflow: hidden;

    display: flex;
    align-items: center;

    min-height: 135px;
    padding: 30px 34px;

    text-decoration: none;
    color: #F3F8FF;

    background: linear-gradient(
        115deg,
        rgba(22, 53, 84, 0.94),
        rgba(12, 35, 62, 0.96)
    );

    border: 1px solid rgba(130, 193, 235, 0.20);
    border-radius: 17px;

    box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.12);

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

/* ACCENT LINE */

.unit-card::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 4px;

    background: linear-gradient(
        180deg,
        #83DDFF,
        #2077BA
    );
}

/* DECORATIVE GLOW */

.unit-card::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -80px;
    bottom: -110px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(47, 153, 225, 0.13),
        transparent 70%
    );

    pointer-events: none;
}

.unit-card:hover {
    transform: translateY(-3px);

    border-color: rgba(130, 210, 255, 0.55);

    box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.20);
}

.unit-card:focus-visible {
    outline: 3px solid #8EDBFF;
    outline-offset: 4px;
}

/* UNIT CONTENT */

.unit-content {
    position: relative;
    z-index: 1;
    width: 100%;
}

.unit-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 12px;
    margin-bottom: 15px;
}

.unit-number {
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.5px;

    color: #82CFFF;
}

.question-count {
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 400;

    color: #9CB2C8;
}

.unit-title {
    display: block;

    font-size: 27px;
    font-weight: 700;
    line-height: 1.3;

    color: #F7FAFF;
}

/* ==========================================
   DESKTOP
========================================== */

@media (min-width: 900px) {

    .container {
        padding-top: 75px;
    }

    .hero {
        padding-bottom: 55px;
    }

    .unit-card {
        min-height: 145px;
    }
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

    .container {
        padding: 25px 16px 32px;
    }

    .hero {
        padding: 20px 5px 30px;
    }

    .hero-label {
        margin-bottom: 16px;
        padding: 7px 13px;

        font-size: 9px;
        letter-spacing: 2px;
    }

    .hero-title {
        font-size: clamp(36px, 10vw, 48px);
        letter-spacing: -0.8px;
        line-height: 1.12;
    }

    .hero-divider {
        margin: 19px auto 17px;
        width: 85px;
    }

    .hero-subtitle {
        font-size: 10px;
        letter-spacing: 1.4px;
    }

    .units {
        gap: 13px;
    }

    .unit-card {
        min-height: 112px;
        padding: 20px 20px 21px;
        border-radius: 14px;
    }

    .unit-top {
        margin-bottom: 11px;
    }

    .unit-number {
        font-size: 11px;
        letter-spacing: 2px;
    }

    .question-count {
        font-size: 11px;
    }

    .unit-title {
        font-size: 20px;
        line-height: 1.3;
    }
}

/* ==========================================
   SMALL PHONES
========================================== */

@media (max-width: 380px) {

    .container {
        padding-left: 12px;
        padding-right: 12px;
    }

    .hero-title {
        font-size: 35px;
    }

    .unit-card {
        padding: 18px 16px;
        min-height: 105px;
    }

    .unit-title {
        font-size: 18px;
    }
}

/* ==========================================
   SHORT MOBILE SCREENS
========================================== */

@media (max-width: 600px) and (max-height: 700px) {

    .container {
        padding-top: 15px;
    }

    .hero {
        padding-top: 10px;
        padding-bottom: 22px;
    }

    .hero-label {
        margin-bottom: 12px;
    }

    .hero-divider {
        margin: 13px auto;
    }

    .units {
        gap: 10px;
    }

    .unit-card {
        min-height: 96px;
        padding-top: 16px;
        padding-bottom: 16px;
    }

    .unit-title {
        font-size: 18px;
    }
}

/* ==========================================
   REDUCED MOTION
========================================== */

@media (prefers-reduced-motion: reduce) {

    .unit-card {
        transition: none;
    }
}

</style>

</head>

<body>

<main class="container">

    <!-- HEADER -->

    <header class="hero">

        <div class="hero-label">
            Digital Study Notes
        </div>

        <h1 class="hero-title">
            Cyber
            <span>Criminology</span>
        </h1>

        <div class="hero-divider"></div>

        <p class="hero-subtitle">
            Exam Oriented Questions &amp; Answers
        </p>

    </header>

    <!-- THREE UNIT CARDS -->

    <nav class="units" aria-label="Select a unit">

        <!-- UNIT I -->

        <a href="unit1/index.html" class="unit-card">

            <div class="unit-content">

                <div class="unit-top">

                    <span class="unit-number">
                        UNIT I
                    </span>

                    <span class="question-count">
                        10 Questions
                    </span>

                </div>

                <span class="unit-title">
                    Introduction to Cyber Criminology
                </span>

            </div>

        </a>

        <!-- UNIT II -->

        <a href="unit2/index.html" class="unit-card">

            <div class="unit-content">

                <div class="unit-top">

                    <span class="unit-number">
                        UNIT II
                    </span>

                    <span class="question-count">
                        12 Questions
                    </span>

                </div>

                <span class="unit-title">
                    Digital Piracy and Cyber Victimization
                </span>

            </div>

        </a>

        <!-- UNIT III -->

        <a href="unit3/index.html" class="unit-card">

            <div class="unit-content">

                <div class="unit-top">

                    <span class="unit-number">
                        UNIT III
                    </span>

                    <span class="question-count">
                        8 Questions
                    </span>

                </div>

                <span class="unit-title">
                    Cyber Crime, Victimization and Human Rights
                </span>

            </div>

        </a>

    </nav>

</main>

</body>

</html>
