<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Criminology</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f4f4;
            color: #222;
            font-family: "Times New Roman", Times, serif;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 18px 50px;
        }

        .header {
            text-align: center;
            background: #ffffff;
            padding: 32px 20px;
            border-radius: 8px;
            margin-bottom: 28px;
            border-top: 5px solid #263b5e;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            font-weight: normal;
            letter-spacing: 1px;
            color: #1d2f4d;
        }

        .section-title {
            font-size: 21px;
            font-weight: normal;
            color: #1d2f4d;
            margin: 0 0 15px;
            border-bottom: 1px solid #bbb;
            padding-bottom: 7px;
        }

        .unit-card {
            display: block;
            background: #ffffff;
            margin-bottom: 18px;
            padding: 22px;
            border-radius: 7px;
            text-decoration: none;
            color: inherit;
            border-left: 4px solid #263b5e;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .unit-number {
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .unit-card h2 {
            margin: 4px 0 12px;
            font-size: 24px;
            font-weight: normal;
            color: #1d2f4d;
        }

        .open-unit {
            font-size: 17px;
            color: #1d4f91;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 18px;
            border-top: 1px solid #ccc;
            color: #777;
            font-size: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px 12px 35px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 28px;
            }

            .unit-card {
                padding: 19px 17px;
            }

            .unit-card h2 {
                font-size: 21px;
            }

            .open-unit {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>CYBER CRIMINOLOGY</h1>
    </header>

    <h2 class="section-title">Select a Unit</h2>


    <a href="unit1/index.html" class="unit-card">
        <div class="unit-number">Unit I</div>

        <h2>Introduction to Cyber Criminology</h2>

        <div class="open-unit">
            View Unit I →
        </div>
    </a>


    <a href="unit2/index.html" class="unit-card">
        <div class="unit-number">Unit II</div>

        <h2>Digital Piracy and Cyber Victimization</h2>

        <div class="open-unit">
            View Unit II →
        </div>
    </a>


    <a href="unit3/index.html" class="unit-card">
        <div class="unit-number">Unit III</div>

        <h2>Cyber Crime, Victimization and Human Rights</h2>

        <div class="open-unit">
            View Unit III →
        </div>
    </a>


    <footer class="footer">
        Cyber Criminology
    </footer>

</div>

</body>
</html>
